# pnpm 11 reads its settings from this file. There is no root workspace, so
# every package carries the settings it needs rather than inheriting them.
minimumReleaseAge: 0
verifyDepsBeforeRun: false
allowBuilds:
  "@swc/core": true
  cbor-extract: true
  core-js: true
  esbuild: true
overrides:
  "@automerge/automerge": 3.3.2
  "@automerge/automerge-repo": 2.6.0-subduction.48
  "@automerge/automerge-subduction": 0.16.1
