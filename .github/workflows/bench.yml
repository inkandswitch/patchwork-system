name: bench

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MARKER: "<!-- patchwork-bench -->"

jobs:
  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    # main and the PR on the same runner, one after the other: runner numbers
    # drift between runs, so a PR is only ever compared with main measured
    # alongside it. Only Patchwork as it ships (`patchwork` mode, whose tests
    # are titled "patchwork: …" or "S5 patchwork, …"): the other modes and the
    # storage adapters are alternatives the bench explores, not what merging
    # changes.
    steps:
      - uses: actions/checkout@v4
        with:
          path: pr

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: main

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: pr/package.json
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pr/pnpm-lock.yaml
            main/pnpm-lock.yaml

      - name: build main
        working-directory: main
        run: pnpm install --frozen-lockfile && pnpm build

      - name: build the PR
        working-directory: pr
        run: pnpm install --frozen-lockfile && pnpm build

      - name: install chromium
        run: |
          (cd main/sites/bench && pnpm exec playwright install --with-deps chromium)
          (cd pr/sites/bench && pnpm exec playwright install --with-deps chromium)

      # A single run of a benchmark can be off by more than the PR changes it,
      # so each side runs ROUNDS times, alternating, so that the runner
      # slowing down partway affects both. Failed tests still record their
      # rows, so every round reports whatever got measured; main failing
      # doesn't fail the PR, the PR failing does, once it's been reported.
      - name: bench main and the PR, alternating
        env:
          ROUNDS: 3
        run: |
          for side in main pr; do (cd $side/sites/bench && pnpm exec vite build); done
          for round in $(seq "$ROUNDS"); do
            for side in main pr; do
              echo "::group::$side, round $round"
              rm -f $side/sites/bench/bench-results/*.jsonl
              if ! (cd $side/sites/bench && pnpm exec playwright test -c bench.config.ts --grep "patchwork[:,]"); then
                if [ "$side" = pr ]; then touch pr-failed; fi
              fi
              mkdir -p "runs/$side-$round"
              cp $side/sites/bench/bench-results/*.jsonl "runs/$side-$round/" 2>/dev/null || true
              echo "::endgroup::"
            done
          done

      - name: compare
        if: always()
        run: |
          node pr/sites/bench/compare.ts --main runs/main-* --pr runs/pr-* > compare.md
          cat compare.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require("fs")
            let compare = ""
            try { compare = fs.readFileSync("compare.md", "utf8") } catch {}
            if (!compare) return
            const marker = process.env.MARKER
            const { pull_request } = context.payload
            const head = pull_request.head.sha.slice(0, 7)
            const base = pull_request.base.sha.slice(0, 7)
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              `## Benchmarks: Patchwork with this PR against main`,
              ``,
              `\`${head}\` against main at \`${base}\`, Patchwork as it ships (\`patchwork\` mode), measured one after the other on the same runner ([run](${run})). Lower is better throughout. A row is in the table when every run of the PR came out on the same side of every run of main, with the medians more than 20% apart; every benchmark is below it.`,
              ``,
              compare,
            ].join("\n")
            const {owner, repo} = context.repo
            const issue_number = context.issue.number
            const comments = await github.rest.issues.listComments({owner, repo, issue_number})
            const existing = comments.data.find(c => c.body.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body})
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body})
            }

      - name: fail if the PR's benchmarks failed
        if: always()
        run: test ! -e pr-failed
