packages:
  - core/*
  - e2e
  - packages/*
  - packages/providers/**/*
  - sites/*

overrides:
  "@automerge/automerge": "catalog:"
  "@automerge/automerge-repo": "catalog:"
  "@automerge/automerge-repo-subduction": "catalog:"
  "@automerge/automerge-repo-subduction-network-websocket": "catalog:"
  "@automerge/automerge-repo-subduction-storage-indexeddb": "catalog:"
  "@automerge/automerge-repo-react-hooks": "catalog:"
  "@automerge/react": "catalog:"
  "@automerge/subduction": "catalog:"
  "@keyhive/keyhive": "catalog:"
  solid-automerge: "catalog:"

  # Prod keyhive sites use ARK 0.6's keyhive sync and blob encryption
  # (@inkandswitch/patchwork-bootloader's `@ark-0.6/automerge-repo-keyhive`,
  # see core/bootloader/src/hub/keyhive-ark06.ts). It keeps the automerge-repo
  # 2 and keyhive 0.3 it was published with; the overrides above would pull
  # them onto the current pins.
  "@automerge/automerge-repo-keyhive@0.6.0-alpha.1>@automerge/automerge-repo": 2.6.0-subduction.48
  "@automerge/automerge-repo-keyhive@0.6.0-alpha.1>@keyhive/keyhive": 0.3.0-alpha.1
  "@automerge/automerge-repo-network-websocket@2.6.0-subduction.48>@automerge/automerge-repo": 2.6.0-subduction.48

minimumReleaseAgeExclude:
  - "@automerge/*"
  - "@inkandswitch/*"
  - "@chee/*"
  - solid-automerge
  - "@keyhive/keyhive@0.6.0"

catalog:
  "@automerge/automerge": 3.5.0
  "@automerge/automerge-repo": 3.0.0-alpha.1
  "@automerge/automerge-repo-subduction": 3.0.0-alpha.1
  "@automerge/automerge-repo-subduction-network-websocket": 3.0.0-alpha.1
  "@automerge/automerge-repo-subduction-storage-indexeddb": 3.0.0-alpha.1
  "@automerge/automerge-repo-react-hooks": 3.0.0-alpha.1
  "@automerge/react": 3.0.0-alpha.1
  "@automerge/subduction": 0.27.0
  "@codemirror/commands": ^6.10.4
  "@codemirror/language": ^6.12.4
  "@codemirror/state": ^6.7.1
  "@codemirror/view": ^6.43.6
  "@keyhive/keyhive": 0.6.0
  solid-automerge: ^2.0.1
  solid-js: ^1.9.13
  "@types/node": ^24.0.0
  "@types/react": 18.3.1
  "@types/react-dom": 18.3.1
  react: 18.3.1
  react-dom: 18.3.1
  typescript: ^5.9.3

allowBuilds:
  cbor-extract: true
  esbuild: true

patchedDependencies:
  "@automerge/automerge-repo-subduction@3.0.0-alpha.1": patches/@automerge__automerge-repo-subduction@3.0.0-alpha.1.patch
