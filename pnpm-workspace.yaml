packages:
  - core/*
  - e2e
  - packages/*
  - packages/providers/**/*
  - sites/*

overrides:
  "@automerge/automerge": "catalog:"
  "@automerge/automerge-repo": "catalog:"
  "@automerge/automerge-repo-keyhive": "catalog:"
  "@automerge/automerge-repo-network-broadcastchannel": "catalog:"
  "@automerge/automerge-repo-network-messagechannel": "catalog:"
  "@automerge/automerge-repo-network-websocket": "catalog:"
  "@automerge/automerge-repo-react-hooks": "catalog:"
  "@automerge/automerge-repo-storage-indexeddb": "catalog:"
  "@automerge/automerge-subduction": "catalog:"
  "@automerge/react": "catalog:"
  "@automerge/vanillajs": "catalog:"
  "@keyhive/keyhive": "catalog:"
  solid-automerge: "catalog:"

  # @inkandswitch/patchwork's `@ark-0.6/*` dependencies are the previous
  # keyhive stack, kept whole for sync servers still on it. The overrides
  # above would pull each piece's own dependencies onto the current pins, so
  # they keep the versions they were published with.
  "@automerge/automerge-repo-keyhive@0.6.0-alpha.1>@automerge/automerge-repo": 2.6.0-subduction.48
  "@automerge/automerge-repo-keyhive@0.6.0-alpha.1>@automerge/automerge-repo-network-websocket": 2.6.0-subduction.48
  "@automerge/automerge-repo-keyhive@0.6.0-alpha.1>@automerge/automerge-subduction": 0.16.1
  "@automerge/automerge-repo-keyhive@0.6.0-alpha.1>@keyhive/keyhive": 0.3.0-alpha.1
  "@automerge/automerge-repo@2.6.0-subduction.48>@automerge/automerge-subduction": 0.16.1
  "@automerge/automerge-repo-network-broadcastchannel@2.6.0-subduction.48>@automerge/automerge-repo": 2.6.0-subduction.48
  "@automerge/automerge-repo-network-messagechannel@2.6.0-subduction.48>@automerge/automerge-repo": 2.6.0-subduction.48
  "@automerge/automerge-repo-network-websocket@2.6.0-subduction.48>@automerge/automerge-repo": 2.6.0-subduction.48
  "@automerge/automerge-repo-storage-indexeddb@2.6.0-subduction.48>@automerge/automerge-repo": 2.6.0-subduction.48
  "@automerge/vanillajs@2.6.0-subduction.48>@automerge/automerge-repo": 2.6.0-subduction.48
  "@automerge/vanillajs@2.6.0-subduction.48>@automerge/automerge-repo-network-broadcastchannel": 2.6.0-subduction.48
  "@automerge/vanillajs@2.6.0-subduction.48>@automerge/automerge-repo-network-messagechannel": 2.6.0-subduction.48
  "@automerge/vanillajs@2.6.0-subduction.48>@automerge/automerge-repo-network-websocket": 2.6.0-subduction.48
  "@automerge/vanillajs@2.6.0-subduction.48>@automerge/automerge-repo-storage-indexeddb": 2.6.0-subduction.48

minimumReleaseAgeExclude:
  - "@automerge/*"
  - "@inkandswitch/*"
  - "@chee/*"
  - solid-automerge
  - '@keyhive/keyhive@0.6.0'

catalog:
  "@automerge/automerge": 3.5.0
  "@automerge/automerge-repo": npm:@chee/automerge-repo@2.6.0-rabbit.1
  "@automerge/automerge-repo-keyhive": 0.8.0-alpha.1
  "@automerge/automerge-repo-network-broadcastchannel": npm:@chee/automerge-repo-network-broadcastchannel@2.6.0-rabbit.1
  "@automerge/automerge-repo-network-messagechannel": npm:@chee/automerge-repo-network-messagechannel@2.6.0-rabbit.1
  "@automerge/automerge-repo-network-websocket": npm:@chee/automerge-repo-network-websocket@2.6.0-rabbit.1
  "@automerge/automerge-repo-react-hooks": npm:@chee/automerge-repo-react-hooks@2.6.0-rabbit.1
  "@automerge/automerge-repo-storage-indexeddb": npm:@chee/automerge-repo-storage-indexeddb@2.6.0-rabbit.1
  "@automerge/automerge-repo-storage-nodefs": npm:@chee/automerge-repo-storage-nodefs@2.6.0-rabbit.1
  "@automerge/automerge-subduction": 0.21.0
  "@automerge/react": 2.6.0-subduction.49
  "@automerge/vanillajs": npm:@chee/automerge-vanillajs@2.6.0-rabbit.1
  "@codemirror/commands": ^6.10.4
  "@codemirror/language": ^6.12.4
  "@codemirror/state": ^6.7.1
  "@codemirror/view": ^6.43.6
  "@keyhive/keyhive": 0.6.0
  solid-automerge: ^2.0.1
  solid-js: ^1.9.13
  "@types/node": ^24.0.0
  "@types/react": 18.3.1
  "@types/react-dom": 18.3.1
  react: 18.3.1
  react-dom: 18.3.1
  typescript: ^5.9.3

allowBuilds:
  cbor-extract: true
  esbuild: true

patchedDependencies:
  '@automerge/automerge-repo@2.6.0-subduction.48': patches/@automerge__automerge-repo@2.6.0-subduction.48.patch
