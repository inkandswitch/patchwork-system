packages:
  - core/*
  - e2e
  - packages/*
  - packages/providers/**/*
  - sites/*

overrides:
  "@automerge/automerge": "catalog:"
  "@automerge/automerge-repo": "catalog:"
  "@automerge/automerge-repo-subduction": "catalog:"
  "@automerge/automerge-repo-subduction-network-websocket": "catalog:"
  "@automerge/automerge-repo-subduction-storage-indexeddb": "catalog:"
  "@automerge/automerge-repo-react-hooks": "catalog:"
  "@automerge/react": "catalog:"
  "@automerge/subduction": "catalog:"
  solid-automerge: "catalog:"

minimumReleaseAgeExclude:
  - "@automerge/*"
  - "@inkandswitch/*"
  - "@chee/*"
  - solid-automerge

catalog:
  "@automerge/automerge": 3.5.0
  "@automerge/automerge-repo": 3.0.0-alpha.2
  "@automerge/automerge-repo-subduction": 3.0.0-alpha.2
  "@automerge/automerge-repo-subduction-network-websocket": 3.0.0-alpha.2
  "@automerge/automerge-repo-subduction-storage-indexeddb": 3.0.0-alpha.2
  "@automerge/automerge-repo-react-hooks": 3.0.0-alpha.2
  "@automerge/react": 3.0.0-alpha.2
  "@automerge/subduction": 0.27.0
  "@codemirror/commands": ^6.10.4
  "@codemirror/language": ^6.12.4
  "@codemirror/state": ^6.7.1
  "@codemirror/view": ^6.43.6
  solid-automerge: ^2.0.1
  solid-js: ^1.9.13
  "@types/node": ^24.0.0
  "@types/react": 18.3.1
  "@types/react-dom": 18.3.1
  react: 18.3.1
  react-dom: 18.3.1
  typescript: ^5.9.3

allowBuilds:
  cbor-extract: true
  esbuild: true

patchedDependencies:
  "@automerge/automerge-repo-subduction@3.0.0-alpha.2": patches/@automerge__automerge-repo-subduction@3.0.0-alpha.2.patch
